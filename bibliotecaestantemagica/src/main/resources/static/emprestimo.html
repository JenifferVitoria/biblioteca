<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empréstimos - Biblioteca Mágica</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/emprestimo.css">

    <script defer src="js/emprestimo.js"></script>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div>

           <div class="logo-area text-center">

                     <img src="img/1000424142_82042f263a6f1ff161c5fa51e225e596-17_04_2026__19_59_05-removebg-preview.png"class="logo" alt="Biblioteca Mágica">

                </div>

            <ul class="menu">

                <li><a href="dashboardbibliotecario.html"><i class="bi bi-house"></i> Início</a></li>
                <li><a href="acervo.html"><i class="bi bi-book"></i> Acervo</a></li>

                <li class="active">
                    <a href="#"><i class="bi bi-journal-bookmark"></i> Empréstimos</a>
                </li>

                <li><a href="#"><i class="bi bi-arrow-return-left"></i> Devoluções</a></li>
                <li><a href="#"><i class="bi bi-currency-dollar"></i> Multas</a></li>

            </ul>

        </div>

    </aside>

    <!-- CONTEÚDO -->
    <main class="content">

        <div class="page-header">

            <div>
                <h1>Empréstimos</h1>
                <p>Gerencie os empréstimos da biblioteca</p>
            </div>

            <button class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#emprestimoModal">
                Novo Empréstimo
            </button>

        </div>

        <!-- TABELA -->
        <div class="table-card">

            <div class="table-header">
                <h2>Lista de reservas</h2>
            </div>

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>
                    <tr>
                        <th>Locador</th>
                        <th>Locatário</th>
                        <th>Livro</th>
                        <th>Empréstimo</th>
                        <th>Devolução</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                    </thead>

                    <tbody id="emprestimos"></tbody>

                </table>

            </div>

        </div>

    </main>

</div>

<!-- MODAL -->
<div class="modal fade" id="emprestimoModal" tabindex="-1">

    <div class="modal-dialog modal-xl modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-body p-4">

                <h3 class="text-primary mb-3">Cadastro de Empréstimo</h3>

                <div class="row g-3">

                    <div class="col-md-4">
                        <label>Locador</label>
                        <select id="locador" class="form-select"></select>
                    </div>

                    <div class="col-md-4">
                        <label>Locatário</label>
                        <select id="locatario" class="form-select"></select>
                    </div>

                    <div class="col-md-4">
                        <label>Livro</label>
                        <select id="livro" class="form-select"></select>
                    </div>

                    <div class="col-md-6">
                        <label>Data Empréstimo</label>
                        <input type="date" id="dataEmprestimo" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label>Data Devolução</label>
                        <input type="date" id="dataDevolucao" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label>Status</label>
                        <select id="status" class="form-select">
                            <option>Em andamento</option>
                            <option>Devolvido</option>
                            <option>Atrasado</option>
                        </select>
                    </div>

                </div>

            </div>

            <div class="modal-footer">

                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>

                <button class="btn btn-primary" onclick="salvarEmprestimo()">Salvar</button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
