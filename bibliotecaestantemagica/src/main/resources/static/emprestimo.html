<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Mágica - Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/emprestimo.css">

    <script defer src="js/emprestimo.js"></script>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

     
                 <div class="logo-area">

 <img src="img/1000424142_82042f263a6f1ff161c5fa51e225e596-17_04_2026__19_59_05-removebg-preview.png"class="logo" alt="Biblioteca Mágica"
		     >

            <ul class="menu">

                <li><a href="dashboardbibliotecario.html"><i class="bi bi-house"></i> Início</a></li>
                <li><a href="acervo.html"><i class="bi bi-book"></i>Gerenciar Acervo</a></li>

              <li class="active">
    <a href="locacoes.html">
        <i class="bi bi-journal-bookmark"></i>
        Empréstimos
    </a>
</li>

                <li><a href="multas.html"><i class="bi bi-currency-dollar"></i> Multas</a></li>

               </ul>

           </div> 


        <!-- BOTÕES RODAPÉ -->
        <div class="bottom-buttons">

            <a href="dashboardbibliotecario.html" class="back-btn">
                <i class="bi bi-arrow-left-circle"></i>
                Voltar
            </a>


            <a href="login.html" class="logout-btn">
                <i class="bi bi-box-arrow-left"></i>
                Sair
            </a>

        </div>


    </aside>

    <!-- CONTEÚDO -->
    <main class="content">

        <div class="page-header">

            <div>
                <h1>Empréstimos</h1>
                <p>Gerencie os empréstimos da biblioteca</p>
            </div>

            <button class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#emprestimoModal">
                Novo Empréstimo
            </button>

        </div>

        <!-- TABELA -->
        <div class="table-card">

            <div class="table-header">
                <h2>Lista de Empréstimos</h2>
            </div>

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>
                    <tr>
                        <th>Aluno (RA)</th>
                        <th>Nome</th>
                        <th>Livro</th>
                        <th>Empréstimo</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                    </thead>

                    <tbody id="emprestimos"></tbody>

                </table>

            </div>

        </div>

    </main>

</div>

<!-- MODAL -->
<div class="modal fade" id="emprestimoModal" tabindex="-1">

    <div class="modal-dialog modal-xl modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-body p-4">

                <h3 class="text-primary mb-3">Novo Empréstimo</h3>

                <div class="row g-3">

                    <!-- RA COM BUSCA -->
                    <div class="col-md-6">
                        <label>RA do aluno</label>
                        <div class="input-group">
                            <input type="text" id="raAluno" class="form-control" placeholder="Digite o RA">
                            <button class="btn btn-search-modal" type="button" onclick="buscarAluno()">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </div>

                    <!-- NOME AUTOMÁTICO -->
                    <div class="col-md-6">
                        <label>Nome do aluno</label>
                        <input type="text" id="nomeAluno" class="form-control" readonly>
                    </div>

                    <!-- BUSCA LIVRO -->
                    <div class="col-md-12">
                        <label>Buscar livro</label>
                        <div class="input-group">
                            <input type="text" id="buscaLivro" class="form-control" placeholder="Digite o nome do livro">
                            <button class="btn btn-primary" type="button" onclick="buscarLivro()">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </div>

                    <!-- LISTA DE LIVROS FILTRADOS -->
                    <div class="col-md-12">
                        <label>Selecione o livro</label>
                        <select id="livro" class="form-select" size="5"></select>
                    </div>

                    <!-- DATAS -->
                    <div class="col-md-6">
                        <label>Data Empréstimo</label>
                        <input type="date" id="dataEmprestimo" class="form-control">
                    </div>

 

                    <!-- STATUS -->
                    <div class="col-md-12">
                        <label>Status</label>
                        <select id="status" class="form-select">
                            <option>Em andamento</option>
                            <option>Devolvido</option>
                            <option>Atrasado</option>
                        </select>
                    </div>

                </div>

            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-primary" onclick="salvarEmprestimo()">Reservar</button>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
