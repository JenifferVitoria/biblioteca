<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Empréstimo</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- CSS -->
    <link rel="stylesheet" href="css/emprestimo.css">
    <script type="text/javascript" src="js/emprestimo.js"></script>
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>
                <i class="bi bi-journal-bookmark"></i>
                Cadastro de Empréstimo
            </h3>
        </div>

        <div class="card-body">

            <form>

                <!-- ID -->
                <div class="mb-3">
                    <label class="form-label">ID</label>

                    <input type="number"
                           class="form-control"
                           name="id"
                           placeholder="Digite o ID">
                </div>

                <!-- DATA EMPRÉSTIMO -->
                <div class="mb-3">
                    <label class="form-label">Data do Empréstimo</label>

                    <input type="date"
                           class="form-control"
                           name="dataEmprestimo">
                </div>

                <!-- DATA DEVOLUÇÃO -->
                <div class="mb-3">
                    <label class="form-label">Data da Devolução</label>

                    <input type="date"
                           class="form-control"
                           name="dataDevolucao">
                </div>

                <!-- STATUS -->
                <div class="mb-3">
                    <label class="form-label">Status</label>

                    <select class="form-select" name="status">

                        <option value="">
                            Selecione o status
                        </option>

                        <option value="EM_ANDAMENTO">
                            Em andamento
                        </option>

                        <option value="DEVOLVIDO">
                            Devolvido
                        </option>

                        <option value="ATRASADO">
                            Atrasado
                        </option>

                    </select>
                </div>

                <!-- LOCADOR -->
                <div class="mb-3">
                    <label class="form-label">Locador</label>

                    <input type="text"
                           class="form-control"
                           name="locador"
                           placeholder="Digite o nome do locador">
                </div>

                <!-- LOCATÁRIO -->
                <div class="mb-3">
                    <label class="form-label">Locatário</label>

                    <input type="text"
                           class="form-control"
                           name="locatario"
                           placeholder="Digite o nome do locatário">
                </div>

                <!-- LIVRO -->
                <div class="mb-3">
                    <label class="form-label">Livro</label>

                    <input type="text"
                           class="form-control"
                           name="livro"
                           placeholder="Digite o nome do livro">
                </div>

                <!-- BOTÕES -->
                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-success">

                        <i class="bi bi-check-circle"></i>
                        Salvar

                    </button>

                    <button type="reset"
                            class="btn btn-secondary">

                        <i class="bi bi-x-circle"></i>
                        Limpar

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
