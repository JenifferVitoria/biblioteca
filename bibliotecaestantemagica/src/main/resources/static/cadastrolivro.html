<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Livro - Biblioteca Mágica</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/cadastrolivro.css">
    
    <script type="text/javascript"src="js/cadastrolivro.js"></script>

</head>
<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div>

            <!-- LOGO -->
            <div class="logo-area">

                <img src="file:///C:/Users/Acesso%20Livre/git/repository10/bibliotecaestantemagica/src/main/resources/static/img/1000424142_82042f263a6f1ff161c5fa51e225e596-17_04_2026__19_59_05-removebg-preview.png"
                     alt="Biblioteca Mágica">

   

            </div>

            <!-- MENU -->
            <ul class="menu">

                <li>
                    <a href="#">
                        <i class="bi bi-house"></i>
                        Início
                    </a>
                </li>

                <li class="active">
                    <a href="#">
                        <i class="bi bi-book"></i>
                        Gerenciar Acervo
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-people"></i>
                        Usuários
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-journal-check"></i>
                        Empréstimos
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-arrow-return-left"></i>
                        Devoluções
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-bookmark"></i>
                        Reservas
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-currency-dollar"></i>
                        Multas
                    </a>
                </li>

            </ul>

        </div>

        <!-- SAIR -->
        <a href="#" class="logout-btn">

            <i class="bi bi-box-arrow-left"></i>
            Sair

        </a>

    </aside>

    <!-- CONTEÚDO -->
    <main class="content">

        <!-- TOPO -->
        <div class="topbar">

            <div class="search-box">

                <i class="bi bi-search"></i>

                <input type="text"
                       placeholder="Buscar livro por título, autor ou ISBN...">

            </div>

            <button class="notification-btn">
                <i class="bi bi-bell"></i>
            </button>

        </div>

        <!-- FORMULÁRIO -->
        <div class="form-card">

            <!-- BREADCRUMB -->
            <div class="breadcrumb-custom">

                <span>Início</span>
                <i class="bi bi-chevron-right"></i>

                <span>Gerenciar Acervo</span>
                <i class="bi bi-chevron-right"></i>

                <strong>Cadastrar Novo Livro</strong>

            </div>

            <!-- HEADER -->
            <div class="page-header">

                <h1>Cadastrar Novo Livro</h1>

                <p>
                    Preencha todas as informações do livro para adicioná-lo ao acervo.
                </p>

            </div>

            <form>

                <div class="row">

                    <!-- COLUNA ESQUERDA -->
                    <div class="col-lg-9">

                        <div class="row">

                            <!-- TÍTULO -->
                            <div class="col-md-6 mb-4">

                                <label class="form-label">
                                    Título do Livro *
                                </label>

                                <input type="text" id="titulo"
                                       class="form-control custom-input"
                                       placeholder="Digite o título do livro">

                            </div>


                            <!-- AUTOR -->
                            <div class="col-md-6 mb-4">

                                <label class="form-label">
                                    Autor *
                                </label>

                                <input type="text" id="autor"
                                       class="form-control custom-input"
                                       placeholder="Digite o nome do autor">

                            </div>

                                      <!-- editora -->
                            <div class="col-md-4 mb-4">

                                <label class="form-label">
                                    Editora *
                                </label>

                                <input type="text" id="editora"
                                       class="form-control custom-input"
                                       >

                            </div>

                            <!-- ANO -->
                            <div class="col-md-4 mb-4">

                                <label class="form-label">
                                    Ano de Publicação *
                                </label>

                                <input type="number" id="ano"
                                       class="form-control custom-input"
                                       placeholder="2025">

                            </div>

                            <!-- ISBN -->
                            <div class="col-md-4 mb-4">

                                <label class="form-label">
                                    ISBN *
                                </label>

                                <input type="text" id="isbn"
                                       class="form-control custom-input"
                                       placeholder="978-85-00-00000-0">

                            </div>

                            <!-- CATEGORIA -->
                            <div class="col-md-6 mb-4">

                                <label class="form-label">
                                    Categoria / Gênero *
                                </label>

                                <select class="form-select custom-input" id="categoria">

                                    <option>Selecione</option>
                                    <option>Romance</option>
                                    <option>Suspense</option>
                                    <option>Educação</option>
                                    <option>Fantasia</option>
                                    <option>Autoajuda</option>

                                </select>

                            </div>

        






      

                            <!-- SINOPSE -->
                            <div class="col-12 mb-4">

                                <label class="form-label">
                                    Descrição / Sinopse
                                </label>

                                <textarea class="form-control custom-textarea"
                                          rows="6"
                                          placeholder="Digite a sinopse do livro..."></textarea>

                            </div>

       

                        </div>

                    </div>


                                      <!-- editora -->
                            <div class="col-md-4 mb-4">

                                <label class="form-label">
                                    Upload *
                                </label>

              
								<input type="file" class="form-control custom-input" accept="image/*" id="fileInput">
                            </div>

		                            <!-- CÓDIGO -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Código do Acervo *
                                </label>

                                <input type="text" id="codigo"
                                       class="form-control custom-input"
                                       placeholder="LIV0001">

                            </div>		
                            
                                                        <!-- QUANTIDADE -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Estoque*
                                </label>

                                <input type="number" id="estoque"
                                       class="form-control custom-input"
                                       value="1">

                            </div>
                            
				
				

                </div>

                <!-- BOTÕES -->
                <div class="buttons-area">

                    <button type="button"
                            class="btn btn-cancel">

                        Cancelar

                    </button>

                    <button type="submit"
                            class="btn btn-save">

                        <i class="bi bi-floppy"></i>
                        Salvar Livro

                    </button>

                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
