<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Livro - Biblioteca Mágica</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/cadastrolivro.css">
    
    <script type="text/javascript"src="js/cadastrolivro.js"></script>

</head>
<body>

<div class="layout">

    <!-- SIDEBAR -->
   <aside class="sidebar">


    <!-- LOGO + MENU -->
    <div class="sidebar-top">

        <div class="logo-area text-center">

                           <!-- LOGO -->
                <img src="img/Logo%20estante%20magica.png"
				     class="logo"
				     alt="Biblioteca Estante Mágica">

        </div>


        <!-- MENU -->
        <ul class="menu">

    <li class="active">
        <a href="dashboardbibliotecario.html">
            <i class="bi bi-house"></i>
            Início
        </a>
    </li>


    <li>
        <a href="acervo.html">
            <i class="bi bi-book"></i>
            Controle de Acervo
        </a>
    </li>


    <li>
        <a href="controleusuarios.html">
            <i class="bi bi-people"></i>
            Usuários
        </a>
    </li>


    <li>
        <a href="emprestimo.html">
            <i class="bi bi-journal-check"></i>
            Empréstimos
        </a>
    </li>


    <li>
        <a href="locacoes.html">
            <i class="bi bi-arrow-return-left"></i>
            Devoluções
        </a>
    </li>


    <li>
        <a href="reservas.html">
            <i class="bi bi-bookmark"></i>
            Reservas
        </a>
    </li>


    <li>
        <a href="multas.html">
            <i class="bi bi-currency-dollar"></i>
            Multas
        </a>
    </li>

</ul>

</div>


<!-- SAIR -->
<div class="bottom-buttons">

    <a href="dashboardaluno.html" class="back-btn">
        <i class="bi bi-arrow-left-circle"></i>
        Voltar
    </a>

    <a href="login.html" class="logout-btn">
        <i class="bi bi-box-arrow-left"></i>
        Sair
    </a>

</div>

    </aside>

    <!-- CONTEÚDO -->
    <main class="content">

        <!-- TOPO -->
        <div class="topbar">

        

        </div>

        <!-- FORMULÁRIO -->
        <div class="form-card">

            <!-- BREADCRUMB -->
            <div class="breadcrumb-custom">

                <span>Início</span>
                <i class="bi bi-chevron-right"></i>

                <span>Controle de Acervo</span>
                <i class="bi bi-chevron-right"></i>

                <strong>Cadastrar Novo Livro</strong>

            </div>

            <!-- HEADER -->
            <div class="page-header">

                <h1>Cadastrar Novo Livro</h1>

                <p>
                    Preencha todas as informações do livro para adicioná-lo ao acervo.
                </p>

            </div>

            <form>

                <div class="row">

                    <!-- COLUNA ESQUERDA -->
                    <div class="col-lg-9">

                        <div class="row">

                           <!-- TÍTULO -->
<div class="col-md-6 mb-4">

    <label class="form-label">
        Título do Livro
    </label>

    <input type="text" 
           id="titulo"
           class="form-control custom-input"
           placeholder="Digite o título do livro">

</div>


<!-- AUTOR -->
<div class="col-md-6 mb-4">

    <label class="form-label">
        Autor
    </label>

    <input type="text" 
           id="autor"
           class="form-control custom-input"
           placeholder="Digite o nome do autor">

</div>


<!-- EDITORA -->
<div class="col-md-4 mb-4">

    <label class="form-label">
        Editora
    </label>

    <input type="text" 
           id="editora"
           class="form-control custom-input"
           placeholder="Digite a editora">

</div>


<!-- DISPONIBILIDADE -->
<div class="col-md-4 mb-4">

    <label class="form-label">
        Disponibilidade
    </label>

    <input type="text" 
           id="Disponibilidade"
           class="form-control custom-input"
           placeholder="Ex: Disponível">

</div>


<!-- ANO DE PUBLICAÇÃO -->
<div class="col-md-4 mb-4">

    <label class="form-label">
        Ano de publicação
    </label>

    <input type="text" 
           id="Ano"
           class="form-control custom-input"
           placeholder="Ex: 2024">

</div>


<!-- ISBN -->
<div class="col-md-6 mb-4">

    <label class="form-label">
        ISBN
    </label>

    <input type="text" 
           id="categoria"
           class="form-control custom-input"
           placeholder="Digite o código ISBN">

</div>


<!-- GÊNERO -->
<div class="col-12 mb-4">

    <label class="form-label">
        Gênero
    </label>

    <input class="form-control custom-textarea"
           placeholder="Ex: Romance, Fantasia, Ficção, Tecnologia">

</div>


<!-- CÓDIGO DO ACERVO -->
<div class="col-md-4 mb-4">

    <label class="form-label">
        Código do Acervo
    </label>

    <input type="text" 
           id="codigo"
           class="form-control custom-input"
           placeholder="Digite o código do acervo">

</div>


<!-- ESTOQUE -->
<div class="mb-3">

    <label class="form-label">
        Estoque
    </label>

    <input type="number" 
           id="estoque"
           class="form-control custom-input"
           placeholder="Quantidade disponível"
           value="1">

</div>


<!-- IMAGEM -->
<div class="mb-3">

    <label class="form-label">
        Imagem
    </label>

    <input type="file"
           id="file"
           class="form-control custom-input">

</div>

                        </div>

                    </div>

                </div>

                <!-- BOTÕES -->
                <div class="buttons-area">

                    <button type="button"
                            class="btn btn-cancel">

                        Cancelar

                    </button>

                    <button type="submit"
                            class="btn btn-save" onclick="salvar();">

                        <i class="bi bi-floppy"></i>
                        Salvar Livro

                    </button>

                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
