          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/reservas.css">

</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div>

            <!-- LOGO -->
            <div class="logo-area">

                <img src="img/1000424142_82042f263a6f1ff161c5fa51e225e596-17_04_2026__19_59_05-removebg-preview.png"
                     class="logo"
                     alt="Biblioteca Mágica">

            </div>

            <!-- MENU -->
            <ul class="menu">

                <li>
                    <a href="dashboardaluno.html">
                        <i class="bi bi-house"></i>
                        Início
                    </a>
                </li>

                <li>
                    <a href="livro.html">
                        <i class="bi bi-book"></i>
                        Acervo
                    </a>
                </li>

                <li class="active">
                    <a href="reservas.html">
                        <i class="bi bi-bookmark"></i>
                        Reservas
                    </a>
                </li>

                <li>
                    <a href="emprestimo.html">
                        <i class="bi bi-journal-check"></i>
                        Empréstimos
                    </a>
                </li>

            </ul>

        </div>

        <!-- BOTÕES -->
        <div class="bottom-buttons">

            <a href="dashboardaluno.html" class="back-btn">
                <i class="bi bi-arrow-left-circle"></i>
                Voltar
            </a>

            <a href="login.html" class="logout-btn">
                <i class="bi bi-box-arrow-left"></i>
                Sair
            </a>

        </div>

    </aside>

    <!-- CONTEÚDO -->
   <main class="content">

    <!-- HEADER -->
    <div class="page-header">

        <div>
            <h1>Reservas de Livros</h1>
            <p>Gerencie todas as reservas realizadas pelos usuários.</p>
        </div>

    </div>

    <!-- CARDS -->
    <div class="cards-grid">

        <div class="info-card">
            <div class="card-icon">
                <i class="bi bi-bookmark"></i>
            </div>
            <div>
                <h3>35</h3>
                <p>Total de Reservas</p>
            </div>
        </div>

        <div class="info-card">
            <div class="card-icon">
                <i class="bi bi-clock-history"></i>
            </div>
            <div>
                <h3>12</h3>
                <p>Aguardando Retirada</p>
            </div>
        </div>

        <div class="info-card">
            <div class="card-icon">
                <i class="bi bi-check-circle"></i>
            </div>
            <div>
                <h3>18</h3>
                <p>Convertidas em Empréstimo</p>
            </div>
        </div>

        <div class="info-card">
            <div class="card-icon">
                <i class="bi bi-x-circle"></i>
            </div>
            <div>
                <h3>5</h3>
                <p>Canceladas</p>
            </div>
        </div>

    </div>

    <!-- TABELA -->
    <div class="table-card">

        <div class="table-header">
            <h2>Reservas Registradas</h2>
        </div>

        <div class="table-responsive">

            <table class="table align-middle">

                <thead>
                    <tr>
                        <th>Livro</th>
                        <th>Usuário</th>
                        <th>Data Reserva</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="tabelaReservas">

                </tbody>

            </table>

        </div>

    </div>

</main>
