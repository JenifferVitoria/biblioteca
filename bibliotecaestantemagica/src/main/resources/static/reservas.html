<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biblioteca Mágica - Reservas</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
   <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/reservas.css">

    <!-- JavaScript -->
    <script defer src="js/reservas.js"></script>

</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo-area">

            <img src="img/Logo%20estante%20magica.png"
				     class="logo"
				     alt="Biblioteca Estante Mágica">

            <ul class="menu">

                <li>
                    <a href="dashboardbibliotecario.html">
                        <i class="bi bi-house"></i>
                        Início
                    </a>
                </li>

                <li>
                    <a href="acervo.html">
                        <i class="bi bi-book"></i>
                        Acervo
                    </a>
                </li>

                <li>
                    <a href="locacoes.html">
                        <i class="bi bi-journal-bookmark"></i>
                        Empréstimos
                    </a>
                </li>

                <li class="active">
                    <a href="reservas.html">
                        <i class="bi bi-bookmark-check"></i>
                        Reservas
                    </a>
                </li>

                <li>
                    <a href="multas.html">
                        <i class="bi bi-currency-dollar"></i>
                        Multas
                    </a>
                </li>

            </ul>

        </div>
    <div class="bottom-buttons">

    <a href="dashboardbibliotecario.html" class="btn back-btn">
        <i class="bi bi-arrow-left-circle"></i>
        Voltar
    </a>

    <a href="login.html" class="btn logout-btn">
        <i class="bi bi-box-arrow-left"></i>
        Sair
    </a>

</div>

    </aside>

    <!-- CONTEÚDO -->
    <main class="content">

        <div class="page-header">

            <div>
                <h1>Controle de Reservas do Bibliotecário</h1>
                <p>Gerencie as reservas da biblioteca</p>
            </div>

        </div>

        <!-- TABELA -->
        <div class="table-card">

            <div class="table-header">
                <h2>Lista de Reservas</h2>
            </div>

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>

                    <tr>
                       
                        <th>Livro</th>
                        <th>Autor</th>
                        <th>Data da Reserva</th>
                        <th>Status</th>
                       
                    </tr>

                    </thead>

                    <!-- TABELA DINÂMICA -->
                    <tbody id="tabelaReservas">

                    <!--
                        O JavaScript (reservas.js)
                        irá preencher esta tabela automaticamente.

                        Exemplo da estrutura gerada:

                        <tr>
                            <td>20250001</td>
                            <td>João Silva</td>
                            <td>Dom Casmurro</td>
                            <td>08/07/2026</td>
                            <td>
                                <span class="status active-user">
                                    Reservado
                                </span>
                            </td>
                            <td>
                                <button class="btn btn-primary btn-sm"
                                        onclick="realizarEmprestimo(1)">
                                    <i class="bi bi-journal-bookmark-fill"></i>
                                    Realizar Empréstimo
                                </button>
                            </td>
                        </tr>
                    -->

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
