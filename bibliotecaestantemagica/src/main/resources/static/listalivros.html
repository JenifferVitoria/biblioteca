<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Mágica - Pesquisa de Livros</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/listalivros.css">
</head>
<body>

<div class="dashboard-container">

    <!-- HEADER -->
    <header class="topbar">
        <div class="logo-area">
            <img src="img/1000424142_82042f263a6f1ff161c5fa51e225e596-17_04_2026__19_59_05-removebg-preview.png" alt="Logo Biblioteca">
            <div>
                <h2>Biblioteca Mágica</h2>
                <span>Área do Aluno</span>
            </div>
        </div>

        <div class="profile-area">
            <i class="bi bi-person-circle"></i>
        </div>
    </header>

    <!-- PESQUISA -->
    <section class="search-section">

        <div class="title-area">
            <h1>Pesquisar Livros</h1>
            <p>Encontre livros disponíveis na biblioteca.</p>
        </div>

        <div class="search-box">

            <div class="input-search">
                <i class="bi bi-search"></i>

                <input type="text"
                       placeholder="Digite o nome do livro, autor ou categoria">
            </div>

            <button class="btn-search">
                Pesquisar
            </button>

        </div>

    </section>

    <!-- LISTA DE LIVROS -->
    <section class="books-section">

        <div class="section-header">
            <h2>Livros Encontrados</h2>
        </div>

        <div class="books-grid">

            <!-- CARD -->
            <div class="book-card">

                <div class="book-image">
                    <img src="img/livro1.jpg" alt="Livro">
                </div>

                <div class="book-info">

                    <h3>Dom Casmurro</h3>

                    <p class="author">
                        Machado de Assis
                    </p>

                    <div class="book-details">

                        <span>
                            <i class="bi bi-book"></i>
                            Romance
                        </span>

                        <span class="available">
                            Disponível
                        </span>

                    </div>

                    <button class="btn-details">
                        Ver detalhes
                    </button>

                </div>

            </div>

            <!-- CARD -->
            <div class="book-card">

                <div class="book-image">
                    <img src="img/livro2.jpg" alt="Livro">
                </div>

                <div class="book-info">

                    <h3>O Pequeno Príncipe</h3>

                    <p class="author">
                        Antoine de Saint-Exupéry
                    </p>

                    <div class="book-details">

                        <span>
                            <i class="bi bi-book"></i>
                            Ficção
                        </span>

                        <span class="available">
                            Disponível
                        </span>

                    </div>

                    <button class="btn-details">
                        Ver detalhes
                    </button>

                </div>

            </div>

            <!-- CARD -->
            <div class="book-card">

                <div class="book-image">
                    <img src="img/livro3.jpg" alt="Livro">
                </div>

                <div class="book-info">

                    <h3>Harry Potter</h3>

                    <p class="author">
                        J. K. Rowling
                    </p>

                    <div class="book-details">

                        <span>
                            <i class="bi bi-book"></i>
                            Fantasia
                        </span>

                        <span class="unavailable">
                            Indisponível
                        </span>

                    </div>

                    <button class="btn-details">
                        Ver detalhes
                    </button>

                </div>

            </div>

        </div>

    </section>

</div>

</body>
</html>
