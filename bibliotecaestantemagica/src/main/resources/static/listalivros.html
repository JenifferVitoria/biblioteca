</div>

                <a href="acervo.html">
                    <i class="bi bi-book"></i>
                    Gerenciar Acervo
                </a>

                <a href="emprestimo.html">
                    <i class="bi bi-clipboard-check"></i>

                <a href="locacoes.html">

                <a href="reservas.html">

             <div class="bottom-buttons">

    <a href="dashboardaluno.html" class="back-btn">

    </a>

    <a href="login.html" class="logout-btn">
        <i class="bi bi-box-arrow-left"></i>

    </a>

</div>

        <!-- CONTEÚDO -->
        <main class="content">

            <!-- TOPO -->
            <header class="topbar">

                <i class="bi bi-bell"></i>

                <i class="bi bi-person-circle profile"></i>

            </header>

            <!-- PESQUISA -->
            <section class="card">

                <div class="titulo">

                    <h1>Pesquisar Livros</h1>

                    <p>
                        Encontre livros disponíveis na biblioteca.
                    </p>

                </div>

                <div class="search-area">

                    <div class="search-input">

                        <i class="bi bi-search"></i>

                        <input type="text" id="perquisar"
                            placeholder="Digite o nome do livro, autor ou categoria" >

                    </div>

                    <button onclick="buscarLivro()">
                        Pesquisar
                    </button>

                </div>

            </section>

            <!-- RESULTADOS -->
<div class="custom-card">

    <div class="card-header-custom">
        <h4>Livros Encontrados</h4>
    </div>
 
    <div class="table-responsive">
        <table class="table tabela-livros align-middle">
            <thead>
                <tr>
                    <th id="capa">Capa</th>
                    <th id="titulo">Título</th>
                    <th id="autor">Autor</th>
                    <th id="genero">Gênero</th>
                    <th id="isbn">ISBN</th>
                    <th id="status">Status</th>
                    <th id="acoes">Ações</th>
                </tr>
            </thead>

            <tbody>
            
                         
                    <tr>
                        <td>
                            <img src="@livro.Capa" class="capa-livro" />
                        </td>

                       
                    </tr>
                
            </tbody>
        </table>
    </div>




</div>
