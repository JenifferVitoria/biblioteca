<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acervo — Estante Mágica</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/pages.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="alternarSidebarMobile()"></div>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="conteudo">

        <div class="topbar">
            <div class="d-flex align-items-center gap-3">
                <button class="menu-toggle" onclick="alternarSidebarMobile()"><i class="bi bi-list"></i></button>
                <div>
                    <h1>Acervo</h1>
                    <p>Explore os livros disponíveis na biblioteca</p>
                </div>
            </div>
            <div class="usuario-chip">
                <div class="avatar" data-usuario-inicial>U</div>
                <div>
                    <div class="nome" data-usuario-nome>Usuário</div>
                    <div class="tipo" data-usuario-tipo>Tipo</div>
                </div>
            </div>
        </div>

        <div class="filtros-row">
            <div class="custom-input input-group search-bar">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control" id="buscaAcervo" placeholder="Buscar por título, autor ou gênero..." oninput="filtrarAcervo()">
            </div>
            <div class="custom-input input-group" style="max-width:200px;">
                <span class="input-group-text"><i class="bi bi-funnel"></i></span>
                <select class="form-select" id="filtroDisponibilidade" onchange="filtrarAcervo()">
                    <option value="todos">Todos</option>
                    <option value="disponivel">Disponíveis</option>
                    <option value="indisponivel">Indisponíveis</option>
                </select>
            </div>
        </div>

        <div class="row g-3" id="gridAcervo">
            <div class="col-12 tabela-vazia"><span class="spinner-border spinner-border-sm"></span> Carregando acervo...</div>
        </div>

    </main>
</div>

<!-- MODAL DETALHES DO LIVRO -->
<div class="modal fade" id="modalLivro" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalLivroTitulo">Livro</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-2"><strong>Autor:</strong> <span id="modalLivroAutor">-</span></div>
                <div class="mb-2"><strong>Editora:</strong> <span id="modalLivroEditora">-</span></div>
                <div class="mb-2"><strong>Gênero:</strong> <span id="modalLivroGenero">-</span></div>
                <div class="mb-2"><strong>Ano:</strong> <span id="modalLivroAno">-</span></div>
                <div class="mb-2"><strong>ISBN:</strong> <span id="modalLivroIsbn">-</span></div>
                <div class="mb-2"><strong>Status:</strong> <span id="modalLivroStatus">-</span></div>
            </div>
            <div class="modal-footer">
                <button class="btn-app btn-app-secundario" data-bs-dismiss="modal">Fechar</button>
                <button class="btn-app btn-app-primario" id="btnReservarModal" onclick="reservarLivroAtual()">
                    <i class="bi bi-bookmark-plus"></i> Reservar
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script>
    const usuario = exigirLogin(null);
    let listaAcervo = [];
    let livroSelecionado = null;

    if (usuario) {
        montarSidebar("acervo.html");
        carregarAcervo();
    }

    async function carregarAcervo() {
        try {
            const response = await apiFetch(API.livros.listar());
            listaAcervo = response.ok ? await response.json() : [];
            renderizarGrid(listaAcervo);
        } catch (e) {
            document.getElementById("gridAcervo").innerHTML =
                `<div class="col-12 tabela-vazia"><i class="bi bi-wifi-off"></i>Não foi possível carregar o acervo</div>`;
        }
    }

    function renderizarGrid(livros) {
        const grid = document.getElementById("gridAcervo");
        if (!livros.length) {
            grid.innerHTML = `<div class="col-12 tabela-vazia"><i class="bi bi-book"></i>Nenhum livro encontrado</div>`;
            return;
        }
        grid.innerHTML = livros.map(l => `
            <div class="col-6 col-md-4 col-lg-3">
                <div class="livro-card" role="button" onclick='abrirModalLivro(${l.id})'>
                    <div class="livro-capa"><i class="bi bi-book"></i></div>
                    <div class="livro-corpo">
                        <div class="livro-titulo">${l.titulo || "Sem título"}</div>
                        <div class="livro-autor">${l.autor || "Autor desconhecido"}</div>
                        <div class="livro-rodape">
                            ${badgeStatus(l.disponivel ? "Disponível" : "Indisponível")}
                            <i class="bi bi-chevron-right text-muted"></i>
                        </div>
                    </div>
                </div>
            </div>
        `).join("");
    }

    function filtrarAcervo() {
        const termo = document.getElementById("buscaAcervo").value.toLowerCase();
        const filtro = document.getElementById("filtroDisponibilidade").value;
        let filtrado = listaAcervo.filter(l =>
            (l.titulo || "").toLowerCase().includes(termo) ||
            (l.autor || "").toLowerCase().includes(termo) ||
            (l.genero || "").toLowerCase().includes(termo)
        );
        if (filtro === "disponivel") filtrado = filtrado.filter(l => l.disponivel);
        if (filtro === "indisponivel") filtrado = filtrado.filter(l => !l.disponivel);
        renderizarGrid(filtrado);
    }

    function abrirModalLivro(id) {
        livroSelecionado = listaAcervo.find(l => l.id === id);
        if (!livroSelecionado) return;

        document.getElementById("modalLivroTitulo").textContent = livroSelecionado.titulo || "Livro";
        document.getElementById("modalLivroAutor").textContent = livroSelecionado.autor || "-";
        document.getElementById("modalLivroEditora").textContent = livroSelecionado.editora || "-";
        document.getElementById("modalLivroGenero").textContent = livroSelecionado.genero || "-";
        document.getElementById("modalLivroAno").textContent = livroSelecionado.anoPublicacao || "-";
        document.getElementById("modalLivroIsbn").textContent = livroSelecionado.isbn || "-";
        document.getElementById("modalLivroStatus").innerHTML = badgeStatus(livroSelecionado.disponivel ? "Disponível" : "Indisponível");

        const btnReservar = document.getElementById("btnReservarModal");
        if (usuario.tipo === "Bibliotecário") {
            btnReservar.classList.add("d-none");
        } else {
            btnReservar.classList.remove("d-none");
            btnReservar.disabled = !livroSelecionado.disponivel;
            btnReservar.innerHTML = livroSelecionado.disponivel
                ? '<i class="bi bi-bookmark-plus"></i> Reservar'
                : '<i class="bi bi-bookmark-x"></i> Indisponível';
        }

        new bootstrap.Modal(document.getElementById("modalLivro")).show();
    }

    async function reservarLivroAtual() {
        if (!livroSelecionado) return;
        const btn = document.getElementById("btnReservarModal");
        btn.disabled = true;

        try {
            const reserva = {
                livro: livroSelecionado.titulo,
                autor: livroSelecionado.autor,
                dataDaReserva: new Date().toISOString().slice(0, 10),
                status: "Reservado"
            };

            const [resReserva, resLivro] = await Promise.all([
                apiFetch(API.reservas.salvar(), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(reserva)
                }),
                apiFetch(API.livros.reservar(livroSelecionado.id), { method: "PUT" })
            ]);

            if (!resReserva.ok) {
                mostrarToast("Não foi possível concluir a reserva.", "erro");
                btn.disabled = false;
                return;
            }

            mostrarToast("Livro reservado com sucesso!");
            bootstrap.Modal.getInstance(document.getElementById("modalLivro")).hide();
            carregarAcervo();

        } catch (e) {
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
