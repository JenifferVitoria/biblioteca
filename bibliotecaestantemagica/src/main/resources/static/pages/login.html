<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Estante Mágica</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/pages.css" rel="stylesheet">
</head>
<body>

<div class="auth-shell">

    <div class="auth-lado-visual">
        <div class="icone-grande"><i class="bi bi-book-fill"></i></div>
        <h2>Estante Mágica</h2>
        <p>Sistema de gestão da biblioteca escolar: empréstimos, reservas, acervo e usuários em um só lugar.</p>
    </div>

    <div class="auth-lado-form">
        <div class="auth-card">

            <div class="text-center mb-4 d-md-none">
                <div class="icone-grande mx-auto" style="background:var(--azul-claro); color:var(--azul-principal);"><i class="bi bi-book-fill"></i></div>
            </div>

            <h1 class="titulo mb-1">Bem-vindo de volta</h1>
            <p class="subtitulo mb-4">Entre com seu e-mail e senha para continuar</p>

            <div id="alertaLogin" class="alert alert-danger d-none" role="alert"></div>

            <form id="formLogin" onsubmit="return false;">

                <label class="titulo-input">E-mail</label>
                <div class="custom-input input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <label class="titulo-input">Senha</label>
                <div class="custom-input input-group mb-2">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="senha" placeholder="Digite sua senha" required>
                </div>

                <div class="text-end mb-4">
                    <span class="text-muted" style="font-size:12px;">Esqueceu a senha? Fale com a biblioteca.</span>
                </div>

                <button type="submit" id="btnEntrar" class="btn btn-app btn-app-primario w-100 mb-4" onclick="realizarLogin()">
                    <i class="bi bi-box-arrow-in-right"></i> Entrar
                </button>

                <p class="text-center texto-login">
                    Ainda não tem cadastro?
                    <a href="cadastro-usuario.html" class="link-login">Criar conta</a>
                </p>

            </form>

        </div>
    </div>

</div>

<script src="js/api.js"></script>
<script>
    // se já está logado, manda direto pro painel correto
    // (use login.html?sair=1 para forçar a saída e ver a tela de login, útil em demonstrações)
    (function(){
        const params = new URLSearchParams(window.location.search);
        if (params.get("sair") === "1") {
            localStorage.removeItem("usuarioLogado");
            return;
        }
        const usuario = getUsuarioLogado();
        if (usuario) {
            window.location.href = usuario.tipo === "Bibliotecário" ? "dashboard-bibliotecario.html" : "dashboard-aluno.html";
        }
    })();

    async function realizarLogin() {
        const email = document.getElementById("email").value.trim();
        const senha = document.getElementById("senha").value;
        const alerta = document.getElementById("alertaLogin");
        const btn = document.getElementById("btnEntrar");

        alerta.classList.add("d-none");

        if (!email || !senha) {
            alerta.textContent = "Preencha e-mail e senha.";
            alerta.classList.remove("d-none");
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Entrando...';

        try {
            const response = await apiFetch(API.usuarios.login(), {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, senha })
            });

            if (!response.ok) {
                alerta.textContent = "E-mail ou senha inválidos.";
                alerta.classList.remove("d-none");
                return;
            }

            const usuarioLogado = await response.json();
            localStorage.setItem("usuarioLogado", JSON.stringify(usuarioLogado));

            if (usuarioLogado.tipo === "Bibliotecário") {
                window.location.href = "dashboard-bibliotecario.html";
            } else if (usuarioLogado.tipo === "Aluno") {
                window.location.href = "dashboard-aluno.html";
            } else {
                alerta.textContent = "Tipo de usuário não reconhecido: " + usuarioLogado.tipo;
                alerta.classList.remove("d-none");
            }
        } catch (e) {
            // erro já tratado pelo apiFetch (toast)
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Entrar';
        }
    }

    document.getElementById("senha").addEventListener("keydown", (e) => {
        if (e.key === "Enter") realizarLogin();
    });
</script>
</body>
</html>
