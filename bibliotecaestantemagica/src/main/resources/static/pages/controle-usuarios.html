<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuários — Estante Mágica</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/pages.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="alternarSidebarMobile()"></div>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="conteudo">

        <div class="topbar">
            <div class="d-flex align-items-center gap-3">
                <button class="menu-toggle" onclick="alternarSidebarMobile()"><i class="bi bi-list"></i></button>
                <div>
                    <h1>Usuários</h1>
                    <p>Gerencie contas de alunos e bibliotecários</p>
                </div>
            </div>
            <div class="usuario-chip">
                <div class="avatar" data-usuario-inicial>U</div>
                <div>
                    <div class="nome" data-usuario-nome>Usuário</div>
                    <div class="tipo" data-usuario-tipo>Tipo</div>
                </div>
            </div>
        </div>

        <div class="card-app">
            <div class="filtros-row justify-content-between">
                <div class="custom-input input-group search-bar">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control" id="buscaUsuario" placeholder="Buscar por nome ou e-mail..." oninput="filtrarUsuarios()">
                </div>
                <a href="cadastro-usuario.html" class="btn-app btn-app-primario">
                    <i class="bi bi-person-plus"></i> Novo usuário
                </a>
            </div>

            <div class="table-responsive">
                <table class="tabela-app">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Tipo</th>
                            <th>RA</th>
                            <th>Status</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tabelaUsuarios">
                        <tr><td colspan="6" class="tabela-vazia"><span class="spinner-border spinner-border-sm"></span> Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>

<!-- MODAL EDITAR USUÁRIO -->
<div class="modal fade" id="modalEditar" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Editar usuário</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">

                <label class="titulo-input">Nome completo</label>
                <div class="custom-input input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="editNome" required>
                </div>

                <label class="titulo-input">E-mail</label>
                <div class="custom-input input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="editEmail" required>
                </div>

                <label class="titulo-input">Telefone</label>
                <div class="custom-input input-group">
                    <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                    <input type="text" class="form-control" id="editTelefone" required>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-app btn-app-secundario" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn-app btn-app-primario" onclick="salvarEdicaoUsuario()">
                    <i class="bi bi-check-circle"></i> Salvar alterações
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script>
    const usuario = exigirLogin("Bibliotecário");
    let listaUsuarios = [];

    if (usuario) {
        montarSidebar("controle-usuarios.html");
        carregarUsuarios();
    }

    async function carregarUsuarios() {
        try {
            const response = await apiFetch(API.usuarios.listar());
            listaUsuarios = response.ok ? await response.json() : [];
            renderizarTabela(listaUsuarios);
        } catch (e) {
            document.getElementById("tabelaUsuarios").innerHTML =
                `<tr><td colspan="6" class="tabela-vazia"><i class="bi bi-wifi-off"></i>Não foi possível carregar os usuários</td></tr>`;
        }
    }

    function renderizarTabela(usuarios) {
        const corpo = document.getElementById("tabelaUsuarios");
        if (!usuarios.length) {
            corpo.innerHTML = `<tr><td colspan="6" class="tabela-vazia"><i class="bi bi-people"></i>Nenhum usuário encontrado</td></tr>`;
            return;
        }
        corpo.innerHTML = usuarios.map(u => `
            <tr>
                <td>${u.nome || "-"}</td>
                <td>${u.email || "-"}</td>
                <td>${badgeStatus(u.tipo)}</td>
                <td>${u.ra || "-"}</td>
                <td>${badgeStatus(u.status ? "Ativo" : "Inativo")}</td>
                <td class="text-end">
                    <button class="btn-icone btn-app-secundario" title="Editar" onclick="abrirEdicao(${u.id})"><i class="bi bi-pencil"></i></button>
                    <button class="btn-icone btn-app-perigo" title="Excluir" onclick="excluirUsuario(${u.id})"><i class="bi bi-trash"></i></button>
                </td>
            </tr>
        `).join("");
    }

    function filtrarUsuarios() {
        const termo = document.getElementById("buscaUsuario").value.toLowerCase();
        renderizarTabela(listaUsuarios.filter(u =>
            (u.nome || "").toLowerCase().includes(termo) || (u.email || "").toLowerCase().includes(termo)
        ));
    }

    function abrirEdicao(id) {
        const alvo = listaUsuarios.find(u => u.id === id);
        if (!alvo) return;
        document.getElementById("editId").value = alvo.id;
        document.getElementById("editNome").value = alvo.nome || "";
        document.getElementById("editEmail").value = alvo.email || "";
        document.getElementById("editTelefone").value = alvo.telefone || "";
        new bootstrap.Modal(document.getElementById("modalEditar")).show();
    }

    async function salvarEdicaoUsuario() {
        const id = document.getElementById("editId").value;
        const usuarioEditado = {
            nome: document.getElementById("editNome").value.trim(),
            email: document.getElementById("editEmail").value.trim(),
            telefone: document.getElementById("editTelefone").value.trim(),
        };

        try {
            const response = await apiFetch(API.usuarios.atualizar(id), {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(usuarioEditado)
            });

            if (!response.ok) {
                mostrarToast("Não foi possível atualizar o usuário.", "erro");
                return;
            }

            mostrarToast("Usuário atualizado com sucesso!");
            bootstrap.Modal.getInstance(document.getElementById("modalEditar")).hide();
            carregarUsuarios();

        } catch (e) {
            // erro já tratado (toast)
        }
    }

    async function excluirUsuario(id) {
        if (id == usuario.id) {
            mostrarToast("Você não pode excluir sua própria conta.", "erro");
            return;
        }
        if (!confirm("Deseja realmente excluir este usuário?")) return;
        try {
            const response = await apiFetch(API.usuarios.deletar(id), { method: "DELETE" });
            if (!response.ok) {
                mostrarToast("Não foi possível excluir o usuário.", "erro");
                return;
            }
            mostrarToast("Usuário excluído.");
            carregarUsuarios();
        } catch (e) {
            // erro já tratado (toast)
        }
    }
</script>
</body>
</html>
