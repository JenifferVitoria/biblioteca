<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multas — Estante Mágica</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/pages.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="alternarSidebarMobile()"></div>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="conteudo">

        <div class="topbar">
            <div class="d-flex align-items-center gap-3">
                <button class="menu-toggle" onclick="alternarSidebarMobile()"><i class="bi bi-list"></i></button>
                <div>
                    <h1>Multas</h1>
                    <p>Empréstimos em atraso e cobrança via Pix</p>
                </div>
            </div>
            <div class="usuario-chip">
                <div class="avatar" data-usuario-inicial>U</div>
                <div>
                    <div class="nome" data-usuario-nome>Usuário</div>
                    <div class="tipo" data-usuario-tipo>Tipo</div>
                </div>
            </div>
        </div>

        <div class="card-app mb-4">
            <div class="card-titulo">
                <span><i class="bi bi-exclamation-triangle text-danger me-2"></i>Empréstimos atrasados</span>
            </div>
            <p class="kpi-label mb-3">Multa calculada em R$ 1,50 por dia de atraso (valor de referência).</p>
            <div class="table-responsive">
                <table class="tabela-app">
                    <thead>
                        <tr>
                            <th>Livro</th>
                            <th>Aluno</th>
                            <th>Data empréstimo</th>
                            <th>Dias de atraso</th>
                            <th>Multa</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tabelaMultas">
                        <tr><td colspan="6" class="tabela-vazia"><span class="spinner-border spinner-border-sm"></span> Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>

<!-- MODAL PIX -->
<div class="modal fade" id="modalPix" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-qr-code me-2"></i>Pagamento via Pix</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <p class="kpi-label mb-3">Escaneie o QR Code para pagar a multa</p>
                <div id="pixLoading"><span class="spinner-border"></span></div>
                <img id="pixQrCode" class="d-none" style="max-width:240px; border-radius:12px; border:1px solid var(--azul-borda);">
                <div class="fw-bold mt-3" id="pixValor" style="color:var(--azul-principal); font-size:20px;"></div>
                <textarea class="form-control mt-3 d-none" id="pixPayload" rows="3" readonly style="font-size:11px;"></textarea>
                <button class="btn-app btn-app-secundario btn-app-sm mt-2 d-none" id="btnCopiarPix" onclick="copiarPayloadPix()">
                    <i class="bi bi-clipboard"></i> Copiar código Pix
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script>
    const usuario = exigirLogin("Bibliotecário");
    const VALOR_POR_DIA = 1.5;

    if (usuario) {
        montarSidebar("multas.html");
        carregarAtrasados();
    }

    function diasDeAtraso(dataEmprestimo) {
        if (!dataEmprestimo) return 0;
        const limite = new Date(dataEmprestimo);
        limite.setDate(limite.getDate() + 10);
        const diff = Math.floor((new Date() - limite) / (1000 * 60 * 60 * 24));
        return diff > 0 ? diff : 0;
    }

    async function carregarAtrasados() {
        try {
            const response = await apiFetch(API.emprestimos.atrasados());
            const atrasados = response.ok ? await response.json() : [];
            const corpo = document.getElementById("tabelaMultas");

            if (!atrasados.length) {
                corpo.innerHTML = `<tr><td colspan="6" class="tabela-vazia"><i class="bi bi-check-circle"></i>Nenhum empréstimo em atraso</td></tr>`;
                return;
            }

            corpo.innerHTML = atrasados.map(e => {
                const dias = diasDeAtraso(e.dataEmprestimo);
                const valor = (dias * VALOR_POR_DIA).toFixed(2);
                return `
                    <tr>
                        <td>${e.livro?.titulo || "-"}</td>
                        <td>${e.usuario?.nome || "-"}</td>
                        <td>${formatarData(e.dataEmprestimo)}</td>
                        <td>${dias} dia(s)</td>
                        <td class="fw-bold" style="color:var(--vermelho)">R$ ${valor}</td>
                        <td class="text-end">
                            <button class="btn-app btn-app-primario btn-app-sm" onclick="abrirPix(${valor})">
                                <i class="bi bi-qr-code"></i> Cobrar via Pix
                            </button>
                        </td>
                    </tr>
                `;
            }).join("");

        } catch (e) {
            document.getElementById("tabelaMultas").innerHTML =
                `<tr><td colspan="6" class="tabela-vazia"><i class="bi bi-wifi-off"></i>Não foi possível carregar os atrasos</td></tr>`;
        }
    }

    let payloadAtual = "";

    async function abrirPix(valor) {
        const modal = new bootstrap.Modal(document.getElementById("modalPix"));
        document.getElementById("pixValor").textContent = "R$ " + Number(valor).toFixed(2);
        document.getElementById("pixLoading").classList.remove("d-none");
        document.getElementById("pixQrCode").classList.add("d-none");
        document.getElementById("pixPayload").classList.add("d-none");
        document.getElementById("btnCopiarPix").classList.add("d-none");
        modal.show();

        try {
            const response = await apiFetch(API.pix.gerar(valor));
            if (!response.ok) {
                mostrarToast("Não foi possível gerar o Pix.", "erro");
                return;
            }
            const dados = await response.json();
            payloadAtual = dados.payload || "";

            document.getElementById("pixQrCode").src = "data:image/png;base64," + dados.qrCodeBase64;
            document.getElementById("pixQrCode").classList.remove("d-none");
            document.getElementById("pixPayload").value = payloadAtual;
            document.getElementById("pixPayload").classList.remove("d-none");
            document.getElementById("btnCopiarPix").classList.remove("d-none");

        } catch (e) {
            // erro já tratado (toast)
        } finally {
            document.getElementById("pixLoading").classList.add("d-none");
        }
    }

    function copiarPayloadPix() {
        navigator.clipboard.writeText(payloadAtual);
        mostrarToast("Código Pix copiado!");
    }
</script>
</body>
</html>
