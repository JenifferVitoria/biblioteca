<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservas — Estante Mágica</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/pages.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="alternarSidebarMobile()"></div>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="conteudo">

        <div class="topbar">
            <div class="d-flex align-items-center gap-3">
                <button class="menu-toggle" onclick="alternarSidebarMobile()"><i class="bi bi-list"></i></button>
                <div>
                    <h1>Reservas</h1>
                    <p>Acompanhe as reservas de livros feitas pelos alunos</p>
                </div>
            </div>
            <div class="usuario-chip">
                <div class="avatar" data-usuario-inicial>U</div>
                <div>
                    <div class="nome" data-usuario-nome>Usuário</div>
                    <div class="tipo" data-usuario-tipo>Tipo</div>
                </div>
            </div>
        </div>

        <div class="card-app">
            <div class="filtros-row">
                <div class="custom-input input-group search-bar">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control" id="buscaReserva" placeholder="Buscar por livro ou autor..." oninput="filtrarReservas()">
                </div>
            </div>

            <div class="table-responsive">
                <table class="tabela-app">
                    <thead>
                        <tr>
                            <th>Livro</th>
                            <th>Autor</th>
                            <th>Data da reserva</th>
                            <th>Status</th>
                            <th>Ações</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tabelaReservas">
                        <tr><td colspan="5" class="tabela-vazia"><span class="spinner-border spinner-border-sm"></span> Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>

<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>

<script src="../js/reservas.js"></script>

<script>
    const usuario = exigirLogin("Bibliotecário");
    let listaReservas = [];

    if (usuario) {
        montarSidebar("reservas.html");
        //carregarReservas();
        listarLivrosCadastrados();
    }

    async function carregarReservas() {
        try {
            const response = await apiFetch(API.reservas.listar());
            listaReservas = response.ok ? await response.json() : [];
            renderizarTabela(listaReservas);
        } catch (e) {
            document.getElementById("tabelaReservas").innerHTML =
                `<tr><td colspan="5" class="tabela-vazia"><i class="bi bi-wifi-off"></i>Não foi possível carregar as reservas</td></tr>`;
        }
        
            
    }

    function renderizarTabela(lista) {
        const corpo = document.getElementById("tabelaReservas");
        if (!lista.length) {
            corpo.innerHTML = `<tr><td colspan="5" class="tabela-vazia"><i class="bi bi-bookmark-star"></i>Nenhuma reserva encontrada</td></tr>`;
            return;
        }
        corpo.innerHTML = lista.map(r => `
            <tr>
                <td>${r.livro || "-"}</td>
                <td>${r.autor || "-"}</td>
                <td>${formatarData(r.dataDaReserva)}</td>
                <td>${badgeStatus(r.status)}</td>
                <td class="text-end">
                    <button class="btn-icone btn-app-perigo" title="Cancelar reserva" onclick="cancelarReserva(${r.id})"><i class="bi bi-x-circle"></i></button>
                </td>
            </tr>
        `).join("");
    }

    function filtrarReservas() {
        const termo = document.getElementById("buscaReserva").value.toLowerCase();
        renderizarTabela(listaReservas.filter(r =>
            (r.livro || "").toLowerCase().includes(termo) || (r.autor || "").toLowerCase().includes(termo)
        ));
    }

    async function cancelarReserva(id) {
        if (!confirm("Deseja realmente cancelar esta reserva?")) return;
        try {
            const response = await apiFetch(API.reservas.deletar(id), { method: "DELETE" });
            if (!response.ok) {
                mostrarToast("Não foi possível cancelar a reserva.", "erro");
                return;
            }
            mostrarToast("Reserva cancelada.");
            carregarReservas();
        } catch (e) {
            // erro já tratado (toast)
        }
    }
</script>
</body>
</html>
