<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar Conta — Estante Mágica</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/pages.css" rel="stylesheet">
</head>
<body>

<div class="cadastro-container">
    <div style="width:100%; max-width:640px;">

        <div class="text-center mb-3">
            <div class="cadastro-icone mx-auto">
                <i class="bi bi-book-fill"></i>
            </div>
        </div>

        <h1 class="titulo text-center">Criar sua conta</h1>
        <p class="subtitulo text-center mb-4">Preencha seus dados para acessar a biblioteca</p>

        <div class="card-cadastro">

            <div id="alertaCadastro" class="alert alert-danger d-none" role="alert"></div>

            <form id="formCadastro" onsubmit="return false;">

                <div class="row g-3">

                    <div class="col-12">
                        <label class="titulo-input">Tipo de usuário</label>
                        <div class="custom-input input-group">
                            <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                            <select class="form-select" id="tipo" required>
                                <option value="" selected disabled>Selecione...</option>
                                <option value="Aluno">Aluno</option>
                                <option value="Bibliotecário">Bibliotecário</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-8">
                        <label class="titulo-input">Nome completo</label>
                        <div class="custom-input input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="nome" placeholder="Digite seu nome completo" required>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="titulo-input">RA (matrícula)</label>
                        <div class="custom-input input-group">
                            <span class="input-group-text"><i class="bi bi-123"></i></span>
                            <input type="text" class="form-control" id="ra" placeholder="Opcional">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="titulo-input">CPF</label>
                        <div class="custom-input input-group">
                            <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                            <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="titulo-input">Data de nascimento</label>
                        <div class="custom-input input-group">
                            <span class="input-group-text"><i class="bi bi-calendar3"></i></span>
                            <input type="date" class="form-control" id="dataNascimento" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="titulo-input">E-mail</label>
                        <div class="custom-input input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" placeholder="seuemail@exemplo.com" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="titulo-input">Telefone</label>
                        <div class="custom-input input-group">
                            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                            <input type="text" class="form-control" id="telefone" placeholder="(00) 00000-0000" required>
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="titulo-input">Endereço</label>
                        <div class="custom-input input-group">
                            <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                            <input type="text" class="form-control" id="endereco" placeholder="Rua, número, bairro, cidade" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="titulo-input">Senha</label>
                        <div class="custom-input input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="senha" placeholder="Crie uma senha" required minlength="4">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="titulo-input">Confirmar senha</label>
                        <div class="custom-input input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="confirmarSenha" placeholder="Repita a senha" required minlength="4">
                        </div>
                    </div>

                </div>

                <button type="submit" id="btnCadastrar" class="btn btn-cadastrar w-100 mt-4" onclick="cadastrarUsuario()">
                    <i class="bi bi-check-circle"></i> Criar conta
                </button>

                <p class="text-center texto-login mt-3">
                    Já tem uma conta?
                    <a href="login.html" class="link-login">Entrar</a>
                </p>

            </form>

        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    function validarCpf(cpf) {
        return cpf.replace(/\D/g, "").length === 11;
    }

    async function cadastrarUsuario() {
        const alerta = document.getElementById("alertaCadastro");
        alerta.classList.add("d-none");

        const tipo = document.getElementById("tipo").value;
        const nome = document.getElementById("nome").value.trim();
        const ra = document.getElementById("ra").value.trim();
        const cpf = document.getElementById("cpf").value.trim();
        const dataNascimento = document.getElementById("dataNascimento").value;
        const email = document.getElementById("email").value.trim();
        const telefone = document.getElementById("telefone").value.trim();
        const endereco = document.getElementById("endereco").value.trim();
        const senha = document.getElementById("senha").value;
        const confirmarSenha = document.getElementById("confirmarSenha").value;

        if (!tipo || !nome || !cpf || !dataNascimento || !email || !telefone || !endereco || !senha) {
            alerta.textContent = "Preencha todos os campos obrigatórios.";
            alerta.classList.remove("d-none");
            return;
        }

        if (!validarCpf(cpf)) {
            alerta.textContent = "Informe um CPF válido (11 dígitos).";
            alerta.classList.remove("d-none");
            return;
        }

        if (senha !== confirmarSenha) {
            alerta.textContent = "As senhas não coincidem.";
            alerta.classList.remove("d-none");
            return;
        }

        // O backend usa "existsByRa(ra)" para checar duplicidade; se dois usuários
        // forem cadastrados com RA vazio, o segundo é rejeitado como "já existe".
        // Por isso, quando o campo é deixado em branco, geramos um RA único.
        const raFinal = ra || `AUTO-${Date.now()}`;

        const usuario = {
            nome, cpf,
            ra: raFinal,
            email, telefone, endereco,
            dataNascimento,
            tipo,
            senha,
            status: true
        };

        const btn = document.getElementById("btnCadastrar");
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Cadastrando...';

        try {
            const response = await apiFetch(API.usuarios.salvar(), {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(usuario)
            });

            if (!response.ok) {
                alerta.textContent = "Não foi possível concluir o cadastro. Verifique se o RA já está em uso.";
                alerta.classList.remove("d-none");
                return;
            }

            mostrarToast("Conta criada com sucesso! Faça login para continuar.");
            setTimeout(() => window.location.href = "login.html", 1200);

        } catch (e) {
            // erro já tratado (toast)
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-check-circle"></i> Criar conta';
        }
    }
</script>
</body>
</html>
