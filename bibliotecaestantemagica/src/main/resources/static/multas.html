<head>
    <meta charset="UTF-8">

          content="width=device-width, initial-scale=1.0">

    <title>Multas - Biblioteca Mágica</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
  <script type="text/javascript" src="js/multas.js"></script> 
  
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="css/multas.css">
   

</head>
<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div>

             <!-- LOGO -->

                <div class="logo-area text-center">

                     <img src="img/1000424142_82042f263a6f1ff161c5fa51e225e596-17_04_2026__19_59_05-removebg-preview.png"class="logo" alt="Biblioteca Mágica">

                </div>

            <!-- MENU -->
            <ul class="menu">

                <li>
                    <a href="dashboardaluno.html">
                        <i class="bi bi-house"></i>
                        Início
                    </a>
                </li>

                <li>
                    <a href="meus-livros.html">
                        <i class="bi bi-book"></i>
                        Meus Livros
                    </a>
                </li>

                <li>
                    <a href="reservalivro.html">
                        <i class="bi bi-bookmark"></i>
                        Reservas
                    </a>
                </li>

                <li class="active">
                    <a href="multas.html">
                        <i class="bi bi-currency-dollar"></i>
                        Multas
                    </a>
                </li>

            </ul>

        </div>

        <!-- SAIR -->
        <a href="#"
           class="logout-btn">

            <i class="bi bi-box-arrow-left"></i>
            Sair

        </a>

    </aside>

    <!-- CONTEÚDO -->
    <main class="content">

        <!-- HEADER -->
        <div class="page-header">

            <div>

                <h1>Minhas Multas</h1>

                <p>
                    Visualize e pague suas multas pendentes.
                </p>

            </div>

        </div>

        
        <!-- TABELA -->
        <div class="table-card">

            <div class="table-header">

                <h2>Histórico de Multas</h2>

            </div>

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>

                    <tr>

                        <th>Livro</th>
                        <th>Dias de Atraso</th>
                        <th>Valor</th>
                        <th>Status</th>
                        <th>Ação</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr>

                        <td class="book-info">

                            <img src="https://m.media-amazon.com/images/I/81hCVEC0ExL.jpg">

                            <div>

                                <strong>Pai Rico Pai Pobre</strong>

                                <span>Robert Kiyosaki</span>

                            </div>

                        </td>

                        <td>5 dias</td>

                        <td>R$ 12,50</td>

                        <td>

                            <span class="status pending">

                                Pendente

                            </span>

                        </td>

                        <td>

                            <button class="btn-pay"
                                    data-bs-toggle="modal"
                                    data-bs-target="#pixModal"
                                    onclick="abrirModalPix('12.00');">

                                <i class="bi bi-qr-code"></i>
                                Pagar

                            </button>


                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

<!-- MODAL PIX -->
<div class="modal fade"
     id="pixModal"
     tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content custom-modal">

            <div class="modal-header border-0">

                <h5 class="modal-title">

                    Pagamento via PIX

                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"></button>

            </div>

            <div class="modal-body">

                <!-- QR CODE -->
                <div class="qrcode-area">

                   <img id="imgPix"
					     src=""
					     alt="QR Code PIX"
					     class="img-fluid">

                </div>

                <!-- CÓDIGO -->
                <div class="pix-code-area">

                    <label>

                        Código PIX

                    </label>

                    <div class="pix-copy">

					<input type="text"
					       id="pixCode"
					       readonly>

                        <button onclick="copiarCodigo()">

                            <i class="bi bi-copy"></i>

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
