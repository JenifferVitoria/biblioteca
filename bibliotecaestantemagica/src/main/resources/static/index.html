<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Mágica - Cadastro</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container-fluid cadastro-container">

    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-7">

            <!-- LOGO -->
            <div class="text-center mb-4">
                 <img src="img/1000424142_82042f263a6f1ff161c5fa51e225e596-17_04_2026__19_59_05-removebg-preview.png"alt="Biblioteca Mágica" class="logo">
            </div>

            <!-- TITULO -->
            <div class="text-center mb-5">
                <h1 class="titulo">CADASTRO</h1>
                <p class="subtitulo">
                    Preencha os dados abaixo para criar sua conta.
                </p>
            </div>

            <!-- CARD -->
            <div class="card card-cadastro shadow-sm border-0">

                <div class="card-body p-4 p-md-5">

                    <form>

                        <!-- NOME -->
                        <div class="mb-4">
                            <label class="form-label titulo-input">
                                NOME COMPLETO
                            </label>

                            <div class="input-group custom-input">
                                <span class="input-group-text">
                                    <i class="bi bi-person"></i>
                                </span>

                                <input type="text"
                                       class="form-control"
                                       placeholder="Digite seu nome completo">
                            </div>
                        </div>

                        <!-- CPF -->
                        <div class="mb-4">
                            <label class="form-label titulo-input">
                                CPF
                            </label>

                            <div class="input-group custom-input">
                                <span class="input-group-text">
                                    <i class="bi bi-credit-card-2-front"></i>
                                </span>

                                <input type="text"
                                       class="form-control"
                                       placeholder="Digite seu CPF">
                            </div>
                        </div>

                        <!-- EMAIL -->
                        <div class="mb-4">
                            <label class="form-label titulo-input">
                                EMAIL
                            </label>

                            <div class="input-group custom-input">
                                <span class="input-group-text">
                                    <i class="bi bi-envelope"></i>
                                </span>

                                <input type="email"
                                       class="form-control"
                                       placeholder="Digite seu email">
                            </div>
                        </div>

                        <!-- TELEFONE -->
                        <div class="mb-4">
                            <label class="form-label titulo-input">
                                TELEFONE
                            </label>

                            <div class="input-group custom-input">
                                <span class="input-group-text">
                                    <i class="bi bi-telephone"></i>
                                </span>

                                <input type="text"
                                       class="form-control"
                                       placeholder="Digite seu telefone">
                            </div>
                        </div>

                        <!-- ENDEREÇO -->
                        <div class="mb-4">
                            <label class="form-label titulo-input">
                                ENDEREÇO
                            </label>

                            <div class="input-group custom-input">
                                <span class="input-group-text">
                                    <i class="bi bi-geo-alt"></i>
                                </span>

                                <input type="text"
                                       class="form-control"
                                       placeholder="Digite seu endereço completo">
                            </div>
                        </div>

                        <!-- DATA NASCIMENTO -->
                        <div class="mb-4">
                            <label class="form-label titulo-input">
                                DATA DE NASCIMENTO
                            </label>

                            <div class="input-group custom-input">
                                <span class="input-group-text">
                                    <i class="bi bi-calendar"></i>
                                </span>

                                <input type="date"
                                       class="form-control">
                            </div>
                        </div>

                        <!-- SELECT -->
                        <div class="mb-4">
                            <label class="form-label titulo-input">
                                TIPO DE USUÁRIO
                            </label>

                            <div class="input-group custom-input">
                                <span class="input-group-text">
                                    <i class="bi bi-people"></i>
                                </span>

                                <select class="form-select">
                                    <option selected disabled>
                                        Selecione o tipo de usuário
                                    </option>

                                    <option>Bibliotecário</option>
                                    <option>Aluno</option>
                                    <option>Professor</option>
                                </select>
                            </div>
                        </div>

                        <!-- BOTÃO -->
                        <div class="d-grid mt-5">
                            <button type="submit" class="btn btn-cadastrar">
                                CADASTRAR
                            </button>
                        </div>

                        <!-- LOGIN -->
                        <div class="text-center mt-4">
                            <span class="texto-login">
                                Já possui uma conta?
                            </span>

                            <a href="#" class="link-login">
                                Faça login
                            </a>
                        </div>

                    </form>

                </div>

            </div>

        </div>
    </div>

</div>

</body>
</html>
