<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Devolução</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/devolucoes.css">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h3>
                    <i class="bi bi-arrow-return-left"></i>
                    Cadastro de Devolução
                </h3>

            </div>

            <div class="card-body">

                <form>

                    <!-- ID -->
                    <div class="mb-3">

                        <label class="form-label">ID</label>

                        <input
                            type="number"
                            class="form-control"
                            name="id"
                            placeholder="Digite o ID">

                    </div>

                    <!-- ID Empréstimo -->
                    <div class="mb-3">

                        <label class="form-label">
                            ID do Empréstimo
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            name="idEmprestimo"
                            placeholder="Digite o ID do empréstimo">

                    </div>

                    <!-- Data Devolução -->
                    <div class="mb-3">

                        <label class="form-label">
                            Data da Devolução
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            name="dataDevolucao">

                    </div>

                    <!-- Observação -->
                    <div class="mb-3">

                        <label class="form-label">
                            Observação
                        </label>

                        <textarea
                            class="form-control"
                            name="observacao"
                            rows="4"
                            placeholder="Digite uma observação"></textarea>

                    </div>

                    <!-- Botões -->
                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-success">

                            <i class="bi bi-check-circle"></i>
                            Salvar

                        </button>

                        <button
                            type="reset"
                            class="btn btn-secondary">

                            <i class="bi bi-x-circle"></i>
                            Limpar

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script src="js/devolucoes.js"></script>

</body>

</html>
